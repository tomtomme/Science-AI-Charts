    <script>
      (function() {
        try {
          var pref = localStorage.getItem('science_iq_theme_preference');
          var isDark = false;
          if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'light') {
            isDark = false;
          } else {
            var h = new Date().getHours();
            isDark = (h < 7 || h >= 20);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
